[project]
name = "dsa4213"
version = "0.1.0"
description = "DSA4213 Group 8 agent project"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1.30.0",
    "openai>=3.8.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "nbstripout>=0.7", "pre-commit>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
# ruff formats python inside markdown; we do not want it rewriting the docs
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
